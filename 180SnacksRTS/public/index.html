<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>180SnacksRTS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">180SNACKS RTS</div>
      <div class="tag">CHANGE REALITY</div>
      <div id="clock" class="clock">--:--:--</div>
    </header>

    <main class="canvas" id="canvas">
      <div class="world" id="world">
        <div class="grid-overlay" aria-hidden="true"></div>

        <section class="widget core-widget" style="left: 5200px; top: 4700px;">
          <div class="widget-head">Pipeline Control</div>
          <h1>Costco → Airtable</h1>
          <button id="runButton" class="run-btn">Run</button>
          <p id="statusText" class="status-line">No run started.</p>
        </section>

        <section id="branchTree" class="branch-tree hidden" style="left: 5600px; top: 4900px;">
          <svg class="branch-lines" viewBox="0 0 780 430" preserveAspectRatio="none" aria-hidden="true">
            <path d="M40 20 L40 220" />
            <path d="M40 220 L180 140" />
            <path d="M40 220 L180 310" />
            <rect x="34" y="214" width="12" height="12" class="node" />
            <rect x="174" y="134" width="12" height="12" class="node" />
            <rect x="174" y="304" width="12" height="12" class="node" />
          </svg>

          <section id="servicesWidget" class="widget child-widget services-widget" style="left: 200px; top: 76px;">
            <div class="widget-head">Services</div>
            <ol id="steps" class="steps"></ol>
          </section>

          <section id="logsWidget" class="widget child-widget logs-widget" style="left: 200px; top: 246px;">
            <div class="widget-head">Execution Logs</div>
            <pre id="logs" class="logs">Waiting for pipeline run...</pre>
          </section>
        </section>
      </div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
