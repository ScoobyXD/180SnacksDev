<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>180 Snacks Pipeline Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>180 Snacks Pipeline Console</h1>
        <p>Run <strong>IRIDev extraction</strong> then <strong>ExcelToAirtable</strong> and track live progress.</p>
      </header>

      <section class="panel controls">
        <button id="runButton" class="primary">Extract Costco reports to Airtable</button>
        <p id="statusText" class="status">No run started.</p>
      </section>

      <section class="panel">
        <h2>Service Progress</h2>
        <ol id="steps" class="steps"></ol>
      </section>

      <section class="panel">
        <h2>Run Logs</h2>
        <pre id="logs" class="logs">Waiting for pipeline run...</pre>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
