<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Mobile viewport — prevents zoom, sets proper width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <title>ShelfTag — 180 Snacks</title>
    
    <!-- PWA Manifest (defines home screen icon, standalone mode, etc.) -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Apple touch icon (shown on iOS home screen) -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <!-- Camera app styles -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- ================================================================== -->
    <!-- CAMERA VIEWFINDER                                                   -->
    <!-- ================================================================== -->
    <div id="camera-container">
        <video id="viewfinder" autoplay playsinline muted></video>
    </div>

    <!-- ================================================================== -->
    <!-- FLASH OVERLAY                                                       -->
    <!-- ================================================================== -->
    <div id="flash"></div>

    <!-- ================================================================== -->
    <!-- CONNECTIVITY INDICATOR                                              -->
    <!-- ================================================================== -->
    <div id="connectivity">
        <div class="dot"></div>
        <span id="connectivity-text">Online</span>
    </div>

    <!-- ================================================================== -->
    <!-- SYNC BADGE (tappable — opens queue modal)                           -->
    <!-- ================================================================== -->
    <div id="sync-badge" class="hidden">0</div>

    <!-- ================================================================== -->
    <!-- QUEUE MODAL                                                         -->
    <!-- Shown when sync badge is tapped. Shows stats + clear queue button.  -->
    <!-- ================================================================== -->
    <div id="queue-modal" class="hidden">
        <div id="queue-modal-content">
            <div id="queue-modal-header">
                <span>Sync Queue</span>
                <button id="queue-modal-close" aria-label="Close">✕</button>
            </div>
            <div id="queue-stats">
                <div class="stat-row">
                    <span>Pending</span>
                    <span id="stat-pending">0</span>
                </div>
                <div class="stat-row">
                    <span>Uploading</span>
                    <span id="stat-syncing">0</span>
                </div>
                <div class="stat-row">
                    <span>Failed</span>
                    <span id="stat-failed">0</span>
                </div>
            </div>
            <button id="clear-queue-btn">Clear Queue</button>
            <p id="clear-queue-note">Removes all queued photos from this device.<br>Photos already in Airtable are not affected.</p>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- TOAST                                                               -->
    <!-- ================================================================== -->
    <div id="toast"></div>

    <!-- ================================================================== -->
    <!-- BOTTOM CONTROLS                                                     -->
    <!-- ================================================================== -->
    <div id="controls">
        <button id="shutter-btn" aria-label="Take photo"></button>
    </div>

    <!-- ================================================================== -->
    <!-- INFO BOX (top of screen, side by side)                              -->
    <!-- ================================================================== -->
    <div id="info-box">
        <div class="input-group">
            <label for="user-name">Name</label>
            <input type="text" id="user-name" placeholder="Tap to enter" autocomplete="off" spellcheck="false">
        </div>
        <div class="input-group">
            <label for="retailer-name">Retailer</label>
            <input type="text" id="retailer-name" placeholder="Tap to enter" autocomplete="off" spellcheck="false">
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- ERROR SCREEN                                                        -->
    <!-- ================================================================== -->
    <div id="error-screen" class="hidden">
        <div class="error-icon">📷</div>
        <p id="error-message">Camera error</p>
    </div>

    <!-- ================================================================== -->
    <!-- APP SCRIPTS                                                         -->
    <!-- ================================================================== -->
    <script type="module" src="/js/app.js"></script>

    <!-- CONNECTIVITY DETECTION (inline) -->
    <script>
        function updateConnectivity() {
            const el = document.getElementById('connectivity');
            const text = document.getElementById('connectivity-text');
            if (navigator.onLine) {
                el.classList.remove('offline');
                text.textContent = 'Online';
            } else {
                el.classList.add('offline');
                text.textContent = 'Offline';
            }
        }
        window.addEventListener('online', updateConnectivity);
        window.addEventListener('offline', updateConnectivity);
        updateConnectivity();
    </script>

</body>
</html>
